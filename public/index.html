    // Remove acentos e caracteres especiais para facilitar a comparação
    function normalizarTexto(texto) {
      return texto.toLowerCase()
                  .normalize("NFD")
                  .replace(/[\u0300-\u036f]/g, "")
                  .replace(/[^a-z0-9\s]/g, "")
                  .trim();
    }

    // Algoritmo de Levenshtein: mede a diferença de letras entre duas palavras
    function calcularDiferenca(str1, str2) {
      const len1 = str1.length;
      const len2 = str2.length;
      const matrix = [];

      for (let i = 0; i <= len1; i++) matrix[i] = [i];
      for (let j = 0; j <= len2; j++) matrix[0][j] = j;

      for (let i = 1; i <= len1; i++) {
        for (let j = 1; j <= len2; j++) {
          const cost = str1[i - 1] === str2[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,      // Deletar
            matrix[i][j - 1] + 1,      // Inserir
            matrix[i - 1][j - 1] + cost // Substituir
          );
        }
      }
      return matrix[len1][len2];
    }

    // Função de busca inteligente com tolerância a erros de digitação
    function buscarRespostaInteligente(pergunta) {
      const perguntaNorm = normalizarTexto(pergunta);
      const palavrasDigitadas = perguntaNorm.split(/\s+/);

      // 1. Busca Direta (Palavra idêntica ou contida)
      for (let chave in MEMORIA_IA) {
        const chaveNorm = normalizarTexto(chave);
        if (perguntaNorm.includes(chaveNorm)) {
          return MEMORIA_IA[chave];
        }
      }

      // 2. Busca por Aproximação (Permite erros de digitação de 1 a 2 letras)
      for (let chave in MEMORIA_IA) {
        const chaveNorm = normalizarTexto(chave);
        const palavrasChave = chaveNorm.split(/\s+/);

        for (let pDigitada of palavrasDigitadas) {
          if (pDigitada.length < 3) continue; // Ignora palavras muito curtas como "a", "de"

          for (let pChave of palavrasChave) {
            if (pChave.length < 3) continue;

            const diferenca = calcularDiferenca(pDigitada, pChave);
            
            // Aceita erro de 1 letra para palavras curtas e até 2 letras para palavras maiores
            const limiteErros = pChave.length > 5 ? 2 : 1;

            if (diferenca <= limiteErros) {
              return MEMORIA_IA[chave];
            }
          }
        }
      }

      return null;
    }

    function processarMatematica(pergunta) {
      const perguntaLimpa = pergunta.toLowerCase().trim();
      
      const matchRaiz = perguntaLimpa.match(/raiz\s*quadrada\s*de\s*(-?\d+\.?\d*)/);
      if (matchRaiz) {
        const num = parseFloat(matchRaiz[1]);
        if (num < 0) return "Erro: Não consigo calcular raiz quadrada de número negativo no conjunto dos Reais!";
        const res = Math.sqrt(num);
        return `A raiz quadrada de ${num} é ${Number.isInteger(res) ? res : res.toFixed(2)}`;
      }

      const matchOp = perguntaLimpa.match(/(-?\d+\.?\d*)\s*([\+\-\*xX\/÷\^])\s*(-?\d+\.?\d*)/);
      if (matchOp) {
        const num1 = parseFloat(matchOp[1]);
        const sinal = matchOp[2];
        const num2 = parseFloat(matchOp[3]);
        let res = 0;

        if (sinal === '+') res = num1 + num2;
        else if (sinal === '-') res = num1 - num2;
        else if (['*', 'x', 'X'].includes(sinal)) res = num1 * num2;
        else if (sinal === '^') return `${num1} elevado a ${num2} é ${Math.pow(num1, num2)}`;
        else if (['/', '÷'].includes(sinal)) {
          if (num2 === 0) return "Erro: Divisão por zero não existe!";
          res = num1 / num2;
        }
        return `Resultado: ${Number.isInteger(res) ? res : res.toFixed(2)}`;
      }
      return null;
    }

    function enviar() {
      const input = document.getElementById('mensagem');
      const chat = document.getElementById('chat');
      const texto = input.value.trim();
      
      if (!texto) return;

      chat.innerHTML += `<div class="msg msg-user"><b>Você:</b> ${escaparHTML(texto)}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      let resposta = processarMatematica(texto);
      let ehDesconhecido = false;

      if (!resposta) {
        resposta = buscarRespostaInteligente(texto);
      }

      if (!resposta) {
        resposta = `Ainda não aprendi sobre '${texto}'. Tente me perguntar sobre finanças, startups, ciências ou contas matemáticas!`;
        ehDesconhecido = true;
      }

      setTimeout(() => {
        const classeMsg = ehDesconhecido ? "msg msg-ia-desconhecido" : "msg msg-ia";
        chat.innerHTML += `<div class="${classeMsg}"><b>Mattei:</b> ${resposta}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 300);
    }

    function checarEnter(event) { if (event.key === 'Enter') enviar(); }
    function escaparHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
  </script>
</body>
</html>
