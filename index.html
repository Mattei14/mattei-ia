<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mattei IA - Assistente Virtual</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: transparent; padding: 10px; display: flex; justify-content: center; align-items: center; }
    .chat-container { width: 100%; max-width: 450px; height: 520px; background: #ffffff; border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0; }
    .chat-header { background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 1.1rem; letter-spacing: 0.5px; }
    .chat-header span { display: block; font-size: 0.75rem; font-weight: normal; opacity: 0.85; margin-top: 2px; }
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #f8fafc; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; word-wrap: break-word; }
    .msg-user { align-self: flex-end; background-color: #4f46e5; color: white; border-bottom-right-radius: 2px; }
    .msg-ia { align-self: flex-start; background-color: #e2e8f0; color: #1e293b; border-bottom-left-radius: 2px; }
    .msg-ia-desconhecido { align-self: flex-start; background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; border-bottom-left-radius: 2px; }
    .input-area { display: flex; padding: 12px; background: #ffffff; border-top: 1px solid #e2e8f0; gap: 8px; }
    input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.9rem; }
    input:focus { border-color: #6366f1; }
    button { padding: 10px 16px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #4338ca; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      Mattei IA 🤖
      <span>Feira de Empreendedorismo</span>
    </div>

    <div class="chat-box" id="chat">
      <div class="msg msg-ia">
        <b>Mattei:</b> Olá! Eu sou o Mattei. Pode me fazer perguntas sobre startups, finanças, ciências ou contas matemáticas!
      </div>
    </div>

    <div class="input-area">
      <input type="text" id="mensagem" placeholder="Digite sua pergunta..." onkeypress="checarEnter(event)">
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>

  <script>
    const MEMORIA_IA = {
      "oi": "Olá, humano! Como vai?", "olá": "Olá, como posso te ajudar?", "bom dia": "Bom dia! Pronto para focar nos projetos hoje?",
      "boa tarde": "Boa tarde! Em que posso ser útil agora?", "boa noite": "Boa noite! Espero que o seu dia tenha sido produtivo.",
      "tchau": "Até logo! Se precisar de mim, estarei por aqui.", "tudo bem?": "Comigo tudo ótimo! E com você, pronto para a feira?",
      "qual o seu nome": "O meu nome é Mattei.", "quem é você": "Eu sou um assistente virtual criado por o got64725.",
      "o que você faz": "Eu processo informações, respondo dúvidas e ajudo a organizar o conhecimento.",
      "quem é seu criador": "Quem me criou é o got64725, criador desse projeto.", "quem é got64725": "Ele é o desenvolvedor dessa IA.",
      "o que é marketing": "Marketing é a estratégia usada para criar, comunicar e entregar valor para um público-alvo.",
      "o que é empreendedorismo": "É o processo de identificar problemas, criar soluções inovadoras e investir recursos para construir um negócio.",
      "o que é lucro": "Lucro é o retorno financeiro positivo de um negócio após subtrair todos os custos e despesas.",
      "o que é mvp": "Significa Mínimo Produto Viável. É uma versão simples de um produto usada para testar uma ideia antes de gastar muito dinheiro.",
      "startup": "Uma empresa jovem, inovadora, com alto potencial de crescimento e que trabalha em cenários de incerteza.",
      "o que é pix": "O sistema de pagamentos instantâneos criado pelo Banco Central do Brasil que funciona 24 horas por dia gratuitamente.",
      "roblox": "Eu amo este universo de bloquinhos!", "ajuda": "Eu posso te explicar como as coisas funcionam. Tente perguntar sobre finanças, matemática ou ciência!",
      "tecnologia": "A tecnologia move o mundo e torna tarefas complexas muito mais simples."
    };

    function processarMatematica(pergunta) {
      const perguntaLimpa = pergunta.toLowerCase().trim();
      
      const matchRaiz = perguntaLimpa.match(/raiz\s*quadrada\s*de\s*(-?\d+\.?\d*)/);
      if (matchRaiz) {
        const num = parseFloat(matchRaiz[1]);
        if (num < 0) return "Erro: Não consigo calcular raiz quadrada de número negativo no conjunto dos Reais!";
        const res = Math.sqrt(num);
        return `A raiz quadrada de ${num} é ${Number.isInteger(res) ? res : res.toFixed(2)}`;
      }

      const matchOp = perguntaLimpa.match(/(-?\d+\.?\d*)\s*([\+\-\*xX\/÷\^])\s*(-?\d+\.?\d*)/);
      if (matchOp) {
        const num1 = parseFloat(matchOp[1]);
        const sinal = matchOp[2];
        const num2 = parseFloat(matchOp[3]);
        let res = 0;

        if (sinal === '+') res = num1 + num2;
        else if (sinal === '-') res = num1 - num2;
        else if (['*', 'x', 'X'].includes(sinal)) res = num1 * num2;
        else if (sinal === '^') return `${num1} elevado a ${num2} é ${Math.pow(num1, num2)}`;
        else if (['/', '÷'].includes(sinal)) {
          if (num2 === 0) return "Erro: Divisão por zero não existe!";
          res = num1 / num2;
        }
        return `Resultado: ${Number.isInteger(res) ? res : res.toFixed(2)}`;
      }
      return null;
    }

    function enviar() {
      const input = document.getElementById('mensagem');
      const chat = document.getElementById('chat');
      const texto = input.value.trim();
      
      if (!texto) return;

      chat.innerHTML += `<div class="msg msg-user"><b>Você:</b> ${escaparHTML(texto)}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      let resposta = processarMatematica(texto);
      let ehDesconhecido = false;

      if (!resposta) {
        const perguntaLimpa = texto.toLowerCase();
        for (let chave in MEMORIA_IA) {
          if (perguntaLimpa.includes(chave)) {
            resposta = MEMORIA_IA[chave];
            break;
          }
        }
      }

      if (!resposta) {
        resposta = `Ainda não aprendi sobre '${texto}'. Tente me perguntar sobre finanças, startups, ciências ou contas matemáticas!`;
        ehDesconhecido = true;
      }

      setTimeout(() => {
        const classeMsg = ehDesconhecido ? "msg msg-ia-desconhecido" : "msg msg-ia";
        chat.innerHTML += `<div class="${classeMsg}"><b>Mattei:</b> ${resposta}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 300);
    }

    function checarEnter(event) { if (event.key === 'Enter') enviar(); }
    function escaparHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }
  </script>
</body>
</html>
