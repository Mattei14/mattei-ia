<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mattei IA - Dark Mode</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .chat-container { width: 100%; max-width: 450px; height: 520px; background: #1e293b; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #334155; }
    .chat-header { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 16px; text-align: center; font-weight: bold; font-size: 1.1rem; }
    .chat-header span { display: block; font-size: 0.75rem; opacity: 0.8; margin-top: 4px; }
    .chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-color: #0f172a; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 0.92rem; line-height: 1.4; color: #f1f5f9; }
    .msg-user { align-self: flex-end; background-color: #4f46e5; border-bottom-right-radius: 2px; }
    .msg-ia { align-self: flex-start; background-color: #334155; border-bottom-left-radius: 2px; }
    .msg-ia-desconhecido { align-self: flex-start; background-color: #78350f; border: 1px solid #92400e; border-bottom-left-radius: 2px; }
    .input-area { display: flex; padding: 12px; background: #1e293b; border-top: 1px solid #334155; gap: 8px; }
    input { flex: 1; padding: 10px 14px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; outline: none; color: white; }
    input:focus { border-color: #818cf8; }
    button { padding: 10px 16px; background-color: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background-color: #6366f1; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">Mattei IA 🤖<span>Feira de Empreendedorismo</span></div>
    <div class="chat-box" id="chat">
      <div class="msg msg-ia"><b>Mattei:</b> Olá! Pronto para começarmos nossa jornada pelo conhecimento?</div>
    </div>
    <div class="input-area">
      <input type="text" id="mensagem" placeholder="Digite sua pergunta..." onkeypress="checarEnter(event)">
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>

  <script>
    const MEMORIA_IA = {
      "oi": "Olá! Estou pronto para ajudar.", "olá": "Olá! O que vamos aprender hoje?",
      "qual o seu nome": "Eu sou o Mattei, sua IA de estudos.", "quem é você": "Um assistente inteligente criado no projeto Mattei-IA.",
      "empreendedorismo": "É a arte de transformar ideias em negócios que resolvem problemas reais.",
      "o que é startup": "Uma empresa inovadora que busca escala e resolve dores do mercado.",
      "pix": "O Pix é o sistema de pagamentos instantâneos do Banco Central que revolucionou nossas finanças.",
      "roblox": "Roblox é um universo incrível de criação e jogos!",
      "tecnologia": "A tecnologia é a base de tudo o que estou processando aqui agora."
    };

    function processarMatematica(pergunta) {
      const p = pergunta.toLowerCase();
      const matchRaiz = p.match(/raiz\s*quadrada\s*de\s*(-?\d+)/);
      if (matchRaiz) return `A raiz quadrada de ${matchRaiz[1]} é ${Math.sqrt(parseFloat(matchRaiz[1])).toFixed(2)}`;
      
      const matchOp = p.match(/(-?\d+)\s*([\+\-\*\/])\s*(-?\d+)/);
      if (matchOp) {
        let res = 0;
        const n1 = parseFloat(matchOp[1]), n2 = parseFloat(matchOp[3]);
        if(matchOp[2] === '+') res = n1 + n2;
        else if(matchOp[2] === '-') res = n1 - n2;
        else if(matchOp[2] === '*') res = n1 * n2;
        else if(matchOp[2] === '/') res = n2 !== 0 ? n1 / n2 : "Erro: div por 0";
        return `Resultado: ${res}`;
      }
      return null;
    }

    function enviar() {
      const input = document.getElementById('mensagem');
      const chat = document.getElementById('chat');
      const texto = input.value.trim();
      if (!texto) return;

      chat.innerHTML += `<div class="msg msg-user">${texto}</div>`;
      input.value = '';
      
      let resposta = processarMatematica(texto);
      if (!resposta) {
        resposta = MEMORIA_IA[texto.toLowerCase()] || "Ainda não aprendi sobre isso, mas posso falar de startups, finanças ou matemática!";
      }

      setTimeout(() => {
        chat.innerHTML += `<div class="msg msg-ia"><b>Mattei:</b> ${resposta}</div>`;
        chat.scrollTop = chat.scrollHeight;
      }, 400);
    }
    function checarEnter(e) { if (e.key === 'Enter') enviar(); }
  </script>
</body>
</html>
